# tables.toml — tabular data for the Model Surgery document.
# Why: separated from content.toml so table rendering code reads one shape only.
# NEVER DELETE COMMENTS — explain every non-obvious line.
# Update comments with the code; do not strip them.

[[table]]                                                  # placed after "four technique families"
after = "The four technique families"                      # anchor: matched against section head
head  = ["Family", "What it does", "Cost"]
rows = [
  ["Dense to MoE",      "Split each FFN into experts; train only the routers",      "Cheap — routers are tiny"],
  ["MoE compression",   "Prune or merge experts in an existing sparse model",       "Cheap, per-layer budgets"],
  ["Structural pruning","Delete whole neurons, heads, or layers from a dense model","Irreversible capacity loss"],
  ["Distillation",      "Train a small student on the teacher's logits",            "Expensive but restorative"],
]

[[table]]
after = "The working pipeline"
head  = ["Stage", "Produces"]
rows = [
  ["profile", "Layer ranking by angular distance, plus a tool-use baseline"],
  ["surgery", "Pruned or converted checkpoint"],
  ["heal",    "Healing step (distillation) — not validated end to end"],
  ["export",  "Throughput figure plus quality delta against the parent"],
]

[[table]]
after = "Why anyone does it"
head  = ["Model", "Active", "Total", "Ratio", "Verdict"]
rows = [
  ["Qwen3-30B-A3B",   "3B",    "30B", "0.10", "Unverified estimate"],
  ["Whittle-27B-A3B", "3B",    "27B", "0.11", "Unverified estimate"],
  ["Whittle-MoE-27B", "17.8B", "27B", "0.66", "Unverified estimate"],
  ["Dense 27B",       "27B",   "27B", "1.00", "Reference"],
]
