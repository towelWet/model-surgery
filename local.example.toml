# local.example.toml — SHAPE of /model-surgery private values. Placeholders only; safe to publish.
# Why: real values live in $CLAUDE_DIR/private/model-surgery.toml (outside this tree, never uploaded).
#      Create it with `private-toml init model-surgery`, then replace every <placeholder>.
# NEVER DELETE COMMENTS — explain every non-obvious line.
# Update comments with the code; do not strip them.

[paths]
workspace = "<workspace>"
reversing = "<reversing>"
