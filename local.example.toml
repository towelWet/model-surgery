[training]
forbidden_password_sha256 = ["<forbidden_password_sha256>"]

[publication]
forbidden_literals = ["<forbidden_literals>"]

[runtime.aliases]
model_path = ["<model_path>"]

[runtime.llamacpp]
source = "<source>"
bin = "<bin>"
